# TulipFleet Customer Edition (Cebi) — izole Docker Compose.
#
# ADR-CE-03 "Bağımsız Çalışma Zamanı": bu stack ana projenin (fleet-backend,
# fleet-postgres, fleet-emqx) container'larından hiçbir şekilde link/import
# edilmez. Aralarında ortak network, ortak volume veya ortak env YOKTUR.
# Aynı fiziksel sunucuda (Hetzner) barındırılsa da mantıksal olarak tam
# izoledir (Cem'in 18.10.2026 altyapı kararı — bkz. FORK_BASELINE.md).
# Sunucu: fleet-enterprise-01. Bu sunucuda hiç Postgres yok (tek instance
# fleet-prod-01'de, 10.0.0.2:5433) — 5433 host portu burada boş, çakışma yok.
# Port binding deseni, bu sunucudaki enterprise-backend ile tutarlı: sadece
# 127.0.0.1'e bind edilir, dışarıya hiç açılmaz; dış erişim Caddy üzerinden.
#
# Deployment Cem'le birlikte adım adım yapılıyor (bkz. FORK_BASELINE.md).
#
# ÖNEMLİ — OLAY (2026-10-19): bu dosyadaki ${CEBI_DB_PASSWORD} / ${CEBI_DB_USER} /
# ${CEBI_DB_NAME} / ${CEBI_BACKEND_PORT} ifadeleri `cebi-backend` servisinin
# `env_file: ./cebi.env`'inden DEĞİL — `docker compose`'un KENDİ değişken
# ikamesinden (variable substitution) gelir. Bunun için bu dosyayla AYNI
# dizinde bir `.env` dosyası (compose'un varsayılan olarak otomatik yüklediği,
# `cebi.env`'den TAMAMEN AYRI bir dosya) bulunmalı ve bu 4 değişkeni
# tanımlamalıdır. Yoksa (veya çalıştıran shell'de export edilmemişse) compose
# SESSİZCE boş string'e düşer — `docker inspect` ile değil, hata fırlatmadan.
# Bu tam olarak 2026-10-19'da cebi-db'nin verisini kaybetmesine yol açan
# zincirin bir parçasıydı (diğer parça: yukarıdaki volume yolu hatası).
# `.env` dosyası ASLA git'e commit edilmez (gizli değer içerir) — sadece
# sunucuda, `cebi.env` ile aynı değerlerle elle oluşturulur.

networks:
  cebi-net:
    name: cebi-net
    driver: bridge

volumes:
  cebi_pgdata:
    name: cebi_pgdata

services:
  cebi-db:
    # Ana proje "TimescaleDB HA (with PostGIS)" kullanıyor (INTEGRATION_BOUNDARIES.md
    # §3.1) — tutarlılık için aynı image ailesi seçildi. Düz timescaledb:2.17.0-pg16
    # image'i önce denendi ama PostGIS içermiyor, prod şemasında `public.geometry`
    # tipine ihtiyaç var (18.10.2026 deploy'da bulundu, bkz. SESSION_NOTE.md).
    # Sade PostgreSQL+PostGIS yeterliyse değiştirilebilir; bu açık bir karar
    # (bkz. FORK_BASELINE.md).
    image: timescale/timescaledb-ha:pg16
    container_name: cebi-db
    restart: unless-stopped
    networks:
      - cebi-net
    environment:
      POSTGRES_DB: ${CEBI_DB_NAME:-cebi_db}
      POSTGRES_USER: ${CEBI_DB_USER:-cebi_admin}
      POSTGRES_PASSWORD: ${CEBI_DB_PASSWORD}
    volumes:
      # OLAY (2026-10-19): bu satır eskiden /var/lib/postgresql/data'ya
      # bağlıydı — ama timescale/timescaledb-ha:pg16 (Zalando Spilo tabanlı)
      # image'inin GERÇEK PGDATA'sı /home/postgres/pgdata/data (container'ın
      # kendi env'i ile doğrulandı: `docker inspect cebi-db` → PGDATA=...).
      # Yani cebi_pgdata volume'ü HİÇBİR ZAMAN gerçek veriyi TUTMAMIŞTI; tüm
      # kalıcılık bugüne kadar şans eseri container'ın kendi yazılabilir
      # katmanından geliyordu (sadece `restart` ile hayatta kaldı, ilk
      # `up -d --build` ile container SİLİNİP YENİDEN oluşturulduğunda veri
      # kayboldu). Düzeltme: volume artık doğru yola bağlanıyor. Detay +
      # kurtarma prosedürü: SESSION_NOTE.md "OLAY" notu.
      - cebi_pgdata:/home/postgres/pgdata
    ports:
      # Sadece host'tan elle erişim için (psql, backup) — loopback'e bind,
      # dışarıya hiç açılmaz. cebi-backend buraya 'cebi-db:5432' üzerinden
      # container network'ü içinden bağlanır, bu mapping'e bağlı değildir.
      - "127.0.0.1:5433:5432"

  cebi-backend:
    build: .
    container_name: cebi-backend
    restart: unless-stopped
    depends_on:
      - cebi-db
    networks:
      - cebi-net
    env_file:
      - ./cebi.env
    environment:
      # DATABASE_URL burada sabitlenir (cebi.env'de AYRICA tanımlanmamalı,
      # çift tanım karışıklığı yaratır) — container network içinden
      # 'cebi-db' servis adıyla bağlanır.
      DATABASE_URL: postgres://${CEBI_DB_USER:-cebi_admin}:${CEBI_DB_PASSWORD}@cebi-db:5432/${CEBI_DB_NAME:-cebi_db}
    ports:
      # Loopback'e bind, dışarıya hiç açılmaz — enterprise-backend'in
      # "127.0.0.1:3001:3001" deseniyle tutarlı. Dış erişim Caddy üzerinden
      # (reverse proxy config'i domain kararı verilince eklenecek).
      - "127.0.0.1:${CEBI_BACKEND_PORT:-3100}:3000"
